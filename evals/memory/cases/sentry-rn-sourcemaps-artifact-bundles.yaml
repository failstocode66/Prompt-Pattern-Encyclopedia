id: sentry-rn-sourcemaps-artifact-bundles
task: |
  After an EAS production build of our React Native (Hermes) app with SENTRY_AUTH_TOKEN set,
  I'm trying to verify the source maps actually uploaded. The Sentry Releases list only shows
  our backend's git-SHA releases — there is no bundleId@version mobile release anywhere. Did
  the source-map upload fail, and if not, how should I actually verify it?
relevant_lessons:
  - 2026-06-17-sentry-rn-sourcemaps-are-artifact-bundles
reference: |
  The upload most likely did NOT fail. Modern @sentry/react-native on Hermes uses debug-ID-based
  source maps uploaded as ARTIFACT BUNDLES, decoupled from the classic "release" concept — so the
  Releases list and the files/source-maps endpoint are the wrong probes and will mislead you.
  Verify instead by querying GET /projects/{org}/{project}/files/artifact-bundles/?sortBy=-date_added
  and looking for a fresh bundle with fileCount >= 2 (the Hermes bundle plus its source map)
  timestamped to the build. Also confirm the EAS build log shows SENTRY_AUTH_TOKEN was loaded —
  the plugin no-ops silently without it.
dimensions: [accuracy, completeness]
