id: railway-redis-wrongpass-drift
task: |
  Our Railway-hosted backend intermittently logs "ReplyError: WRONGPASS invalid
  username-password pair" from its Redis clients. It self-heals after a while, then
  recurs weeks later. The REDIS_URL env var was originally set by copy-pasting the Redis
  service's connection string. By the time we investigate, the password actually matches
  and the health check is green. What is the root cause, how do we confirm it, and what
  is the durable fix?
relevant_lessons:
  - 2026-06-17-railway-literal-connection-vars-drift
reference: |
  The REDIS_URL is a LITERAL copy of the Redis service's connection string, which goes
  stale whenever Railway rotates/regenerates the upstream password — causing intermittent
  WRONGPASS that self-heals and recurs. A literal and a ${{Redis.REDIS_URL}} reference look
  identical in resolved GraphQL output; pass unrendered:true to the variables query to tell
  them apart (a reference returns as ${{Redis.REDIS_URL}}, a literal as the raw redis:// string).
  Durable fix: set the consumer's var to the reference ${{Redis.REDIS_URL}} (variableUpsert) so
  it re-resolves every deploy; then audit other services for literal connection vars.
dimensions: [accuracy, completeness]
