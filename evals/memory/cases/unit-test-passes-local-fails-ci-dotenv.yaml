id: unit-test-passes-local-fails-ci-dotenv
task: |
  I added a new unit test (no database, no server) that just imports a validation-schemas
  module. It passes locally, but in CI the whole unit suite "failed to run" with an
  "Invalid configuration" error in the stack trace, and it's now blocking our gated deploy.
  What is happening, and how do I fix it robustly for the whole test suite rather than just
  this one test?
relevant_lessons:
  - 2026-06-15-unit-test-loads-config-passes-local-fails-ci-dotenv-asymmetry
reference: |
  The test transitively requires a module that validates env vars at require-time and throws
  when they are unset (e.g. config/environment.js calling validateConfig() at module load). It
  passes locally because the dev .env supplies the vars; CI has no .env, so the require throws
  and the whole suite "fails to run". Fix the class by making the unit setup hermetic — in the
  test setup file set process.env.JWT_SECRET ||= ... and DATABASE_URL ||= a dummy value (the ||=
  guard preserves real CI/integration values). Reproduce CI locally by temporarily moving the
  .env aside and re-running the unit suite.
dimensions: [accuracy, completeness]
